apiVersion: v1
kind: Service
metadata:
  name: fedora-vm
  namespace: demo-vms
  labels:
    kubevirt.io/vm: fedora-vm
spec:
  # Change to LoadBalancer if you run MetalLB / Cilium LB IPAM on the Talos cluster.
  type: NodePort
  selector:
    kubevirt.io/vm: fedora-vm
  ports:
    - name: ssh
      port: 22
      targetPort: 22
    - name: http
      port: 80
      targetPort: 80
