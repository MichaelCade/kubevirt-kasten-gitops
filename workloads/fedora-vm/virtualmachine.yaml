apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: fedora-vm
  namespace: demo-vms
  labels:
    app: fedora-vm
    backup: hourly          # picked up by policy-vm-by-label.yaml
spec:
  # Boot PVC is seeded (hack/seed-boot-disk.sh); run the VM. On a fresh cluster,
  # seed the PVC first, then set this to Always.
  runStrategy: Always
  template:
    metadata:
      labels:
        kubevirt.io/vm: fedora-vm
        app: fedora-vm
      annotations:
        kubevirt.io/allow-pod-bridge-network-live-migration: "true"
    spec:
      evictionStrategy: LiveMigrate
      domain:
        cpu:
          cores: 2
        memory:
          guest: 4Gi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: podnet
              masquerade: {}
      networks:
        - name: podnet
          pod: {}
      volumes:
        - name: rootdisk
          # Boots from the standalone PVC defined in pvc.yaml, seeded once by
          # hack/seed-boot-disk.sh (see pvc.yaml for why CDI import isn't used).
          persistentVolumeClaim:
            claimName: fedora-vm-root
        - name: cloudinitdisk
          cloudInitNoCloud:
            networkData: |
              network:
                version: 1
                config:
                  - type: physical
                    name: eth0
                    subnets:
                      - type: dhcp
            userData: |-
              #cloud-config
              users:
                - name: cloud-user
                  sudo: ['ALL=(ALL) NOPASSWD:ALL']
                  groups: sudo
                  shell: /bin/bash
                  lock_passwd: false
              # Demo console login. Change this if you like; SSH via NodePort
              # also works once you add ssh_authorized_keys back above.
              chpasswd:
                expire: false
                users:
                  - {name: cloud-user, password: kasten-demo, type: text}
              ssh_pwauth: true
              packages:
                # qemu-guest-agent is what lets Kasten freeze/thaw the guest
                # filesystem for an APPLICATION-CONSISTENT snapshot. Without it you
                # silently get crash-consistent instead - the job still succeeds.
                - qemu-guest-agent
                - httpd
              runcmd:
                - [ systemctl, enable, --now, qemu-guest-agent ]
                - [ systemctl, enable, --now, httpd ]
                - bash -c 'echo "<h1>GitOps VM - build 1</h1>" > /var/www/html/index.html'
                - bash -c 'mkdir -p /srv/demo && date > /srv/demo/created-at.txt'
  # No dataVolumeTemplates: the boot disk is the standalone PVC in pvc.yaml,
  # seeded once by hack/seed-boot-disk.sh. See pvc.yaml for the rationale.
