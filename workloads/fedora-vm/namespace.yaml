apiVersion: v1
kind: Namespace
metadata:
  name: demo-vms
  labels:
    # Talos enforces baseline Pod Security by default. virt-launcher needs
    # privileged. KubeVirt usually labels the namespace itself, but setting it
    # explicitly in Git removes a whole class of "VM stuck in Scheduling" pain.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
