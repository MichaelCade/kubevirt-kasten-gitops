# Wave 4 - Kasten Location Profile + the VM backup Policy.
# Separate Application because these are aggregated-API objects (see 30-kasten.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kasten-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/MichaelCade/kubevirt-kasten-gitops.git
    targetRevision: main
    path: kasten/config
  destination:
    server: https://kubernetes.default.svc
    namespace: kasten-io
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    retry:
      limit: 10
      backoff: {duration: 15s, factor: 2, maxDuration: 5m}
  ignoreDifferences:
    - group: config.kio.kasten.io
      kind: Policy
      jsonPointers: ["/status", "/metadata/generation"]
    - group: config.kio.kasten.io
      kind: Profile
      jsonPointers: ["/status"]
