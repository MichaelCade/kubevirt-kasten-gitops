# Wave 2 - Containerized Data Importer: pulls the cloud image into a PVC.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cdi
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/MichaelCade/kubevirt-kasten-gitops.git
    targetRevision: main
    path: infra/cdi
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: cdi
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  ignoreDifferences:
    # The CDI operator reconciles its own CRDs at runtime to a shape that differs
    # from the static release manifest (extra served versions, generation bumps).
    # Let the operator own those fields so ArgoCD doesn't flap OutOfSync forever.
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers: ["/status", "/spec/versions", "/metadata/generation"]
    - group: cdi.kubevirt.io
      kind: CDI
      jsonPointers: ["/status"]
